<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061823" />

    <!--
      这两样是没加载完之前的样子，i18next 一起来就由 App 换成观众那种语言（`<html
      lang>` 和 document.title 都在 React 树之外，库不碰它们）。

      写中文是因为这只缸原本就是中文的。英文观众在模块加载完之前会看到一瞬中文标题：
      标签页上那行字比正文低一档，不值得为它在这里内联一套语言检测。
    -->
    <title>电子鱼缸</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
