name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite drives a real browser, so a hang looks like a job that never
    # finishes. Without a limit GitHub waits six hours before killing it.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version` here on purpose: package.json's `packageManager` field is the
      # single source of truth. Specifying both makes the action fail on a version
      # conflict before any test runs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check project
        run: pnpm check
